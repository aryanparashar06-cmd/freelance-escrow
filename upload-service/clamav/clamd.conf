Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 500
StreamMaxLength 50M
MaxFileSize 50M
MaxScanSize 200M
MaxRecursion 8
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
PCREMatchLimit 10000
PCRERecMatchLimit 5000
ScanArchive yes
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000
SelfCheck 600
